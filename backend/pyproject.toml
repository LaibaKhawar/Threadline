[project]
name = "threadline"
version = "0.1.0"
description = "Threadline backend: a local-first personal memory and intelligence platform."
requires-python = ">=3.11"
authors = [{ name = "Laiba Khawar" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "cryptography>=43",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "structlog>=24.4",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26",
  "numpy>=1.26",
  "rapidfuzz>=3.9",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "icalendar>=6.0",
  "python-dateutil>=2.9",
  "email-validator>=2.2",
  "markdown-it-py>=3.0",
]

[project.optional-dependencies]
# ONNX sentence-embedding models (BAAI/bge-small-en-v1.5 by default). No PyTorch needed.
embeddings = ["fastembed>=0.4"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-python-dateutil",
  "types-redis",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "fpdf2>=2.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003", "S311", "RUF012", "E501", "SIM102", "SIM105", "SIM108", "SIM113", "RUF007", "RUF034", "RUF059"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"evals/*" = ["S"]
"scripts/*" = ["S"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs PostgreSQL",
  "ollama: needs a running Ollama server",
]
filterwarnings = ["ignore::DeprecationWarning"]
